<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gBlueSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- ground soft ellipse -->
  <ellipse cx="480" cy="500" rx="340" ry="28" fill="#BFDBFE" opacity="0.45"/>

  <!-- ===== Left phone ===== -->
  <g filter="url(#softShadow)" transform="translate(48 150)">
    <path d="M40 20h120a22 22 0 0 1 22 22v260a22 22 0 0 1-22 22H40a22 22 0 0 1-22-22V42A22 22 0 0 1 40 20Z" fill="url(#gWhite)" stroke="#CBD5E1"/>
    <rect x="28" y="48" width="144" height="220" rx="12" fill="#EFF6FF"/>
    <rect x="78" y="30" width="44" height="8" rx="4" fill="#CBD5E1"/>
    <!-- chat bubbles on screen -->
    <rect x="42" y="72" width="86" height="28" rx="10" fill="#BFDBFE"/>
    <rect x="72" y="112" width="84" height="28" rx="10" fill="url(#gBlue)"/>
    <rect x="42" y="152" width="70" height="22" rx="9" fill="#DBEAFE"/>
    <circle cx="100" cy="286" r="10" fill="#93C5FD"/>
  </g>
  <!-- left outgoing bubble -->
  <g filter="url(#softShadow)" transform="translate(178 118)">
    <path d="M12 8h132a16 16 0 0 1 16 16v36a16 16 0 0 1-16 16H36l-18 14 4-14H12A16 16 0 0 1 -4 60V24A16 16 0 0 1 12 8Z" fill="url(#gBlue)"/>
    <text x="28" y="40" fill="#fff" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">发送消息</text>
  </g>

  <!-- ===== Arrow left to center ===== -->
  <path d="M320 210 C360 190 390 190 430 205" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
  <path d="M422 198l12 8-14 4" fill="#3B82F6"/>

  <!-- ===== Center server rack ===== -->
  <g filter="url(#softShadow)" transform="translate(390 70)">
    <path d="M20 40 L90 10 L160 40 L90 70 Z" fill="#94A3B8"/>
    <path d="M20 40 V150 L90 180 V70 Z" fill="#475569"/>
    <path d="M160 40 V150 L90 180 V70 Z" fill="#334155"/>
    <rect x="38" y="58" width="34" height="8" rx="2" fill="#22D3EE" opacity="0.9"/>
    <rect x="38" y="76" width="34" height="8" rx="2" fill="#38BDF8" opacity="0.7"/>
    <rect x="38" y="94" width="34" height="8" rx="2" fill="#60A5FA" opacity="0.55"/>
    <circle cx="128" cy="68" r="4" fill="#22C55E"/>
    <circle cx="128" cy="86" r="4" fill="#F59E0B"/>
    <circle cx="128" cy="104" r="4" fill="#EF4444"/>
  </g>

  <!-- ===== Database cylinder ===== -->
  <g filter="url(#softShadow)" transform="translate(560 95)">
    <ellipse cx="48" cy="18" rx="48" ry="16" fill="#BFDBFE"/>
    <path d="M0 18 V78 C0 94 21 106 48 106 C75 106 96 94 96 78 V18" fill="url(#gWhite)" stroke="#93C5FD"/>
    <ellipse cx="48" cy="18" rx="48" ry="16" fill="url(#gBlueSoft)" stroke="#60A5FA"/>
    <ellipse cx="48" cy="48" rx="48" ry="14" fill="none" stroke="#93C5FD" opacity="0.7"/>
    <ellipse cx="48" cy="78" rx="48" ry="14" fill="none" stroke="#93C5FD" opacity="0.5"/>
    <text x="28" y="56" fill="#1D4ED8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">DB</text>
  </g>

  <!-- ===== Cubes cluster ===== -->
  <g filter="url(#softShadow)" transform="translate(660 55)">
    <g transform="translate(0 24)">
      <path d="M24 0 L48 12 L24 24 L0 12 Z" fill="#93C5FD"/>
      <path d="M0 12 V36 L24 48 V24 Z" fill="#3B82F6"/>
      <path d="M24 24 V48 L48 36 V12 Z" fill="#2563EB"/>
    </g>
    <g transform="translate(36 8)">
      <path d="M20 0 L40 10 L20 20 L0 10 Z" fill="#BFDBFE"/>
      <path d="M0 10 V30 L20 40 V20 Z" fill="#60A5FA"/>
      <path d="M20 20 V40 L40 30 V10 Z" fill="#2563EB"/>
    </g>
    <g transform="translate(18 40)">
      <path d="M18 0 L36 9 L18 18 L0 9 Z" fill="#DBEAFE"/>
      <path d="M0 9 V27 L18 36 V18 Z" fill="#3B82F6"/>
      <path d="M18 18 V36 L36 27 V9 Z" fill="#1D4ED8"/>
    </g>
  </g>

  <!-- ===== Message Queue platform ===== -->
  <g filter="url(#softShadow)" transform="translate(250 280)">
    <path d="M40 40 L230 0 L420 40 L230 80 Z" fill="#BFDBFE"/>
    <path d="M40 40 V78 L230 118 V80 Z" fill="#60A5FA"/>
    <path d="M420 40 V78 L230 118 V80 Z" fill="#2563EB"/>
    <text x="186" y="48" fill="#1E3A8A" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">消息队列</text>
  </g>

  <!-- ===== Process pills ===== -->
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">
    <!-- row -->
    <g filter="url(#softShadow)" transform="translate(70 380)">
      <rect width="118" height="36" rx="18" fill="url(#gBlue)"/>
      <circle cx="22" cy="18" r="10" fill="#fff" opacity="0.22"/>
      <path d="M17 18h10M22 13v10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="40" y="22" fill="#fff">客户端封装</text>
    </g>
    <g filter="url(#softShadow)" transform="translate(210 380)">
      <rect width="128" height="36" rx="18" fill="url(#gBlue)"/>
      <circle cx="22" cy="18" r="10" fill="#fff" opacity="0.22"/>
      <path d="M17 15c4 0 6 6 10 6s6-6 10-6" stroke="#fff" stroke-width="1.6" fill="none"/>
      <text x="40" y="22" fill="#fff">WebSocket</text>
    </g>
    <g filter="url(#softShadow)" transform="translate(360 380)">
      <rect width="110" height="36" rx="18" fill="url(#gBlue)"/>
      <circle cx="22" cy="18" r="10" fill="#fff" opacity="0.22"/>
      <path d="M18 18l3 3 6-7" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="40" y="22" fill="#fff">身份校验</text>
    </g>
    <g filter="url(#softShadow)" transform="translate(492 380)">
      <rect width="110" height="36" rx="18" fill="url(#gBlue)"/>
      <circle cx="22" cy="18" r="10" fill="#fff" opacity="0.22"/>
      <path d="M17 18h10M19 14h6M19 22h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <text x="40" y="22" fill="#fff">内容过滤</text>
    </g>
    <g filter="url(#softShadow)" transform="translate(624 380)">
      <rect width="118" height="36" rx="18" fill="url(#gBlue)"/>
      <circle cx="22" cy="18" r="10" fill="#fff" opacity="0.22"/>
      <rect x="16" y="13" width="12" height="10" rx="1.5" stroke="#fff" stroke-width="1.5"/>
      <text x="40" y="22" fill="#fff">持久化存储</text>
    </g>
    <g filter="url(#softShadow)" transform="translate(764 380)">
      <rect width="110" height="36" rx="18" fill="url(#gBlue)"/>
      <circle cx="22" cy="18" r="10" fill="#fff" opacity="0.22"/>
      <path d="M17 20c0-4 10-4 10 0v4H17z" stroke="#fff" stroke-width="1.5" fill="none"/>
      <text x="40" y="22" fill="#fff">离线消息</text>
    </g>
  </g>

  <!-- dashed connectors from queue to pills -->
  <g stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 5" fill="none">
    <path d="M320 360 V378"/>
    <path d="M400 360 V378"/>
    <path d="M480 360 V378"/>
    <path d="M560 348 C560 360 550 368 540 378"/>
    <path d="M620 340 C640 355 660 365 680 378"/>
    <path d="M260 350 C220 360 180 368 140 378"/>
  </g>

  <!-- ===== Right phone ===== -->
  <g filter="url(#softShadow)" transform="translate(760 145)">
    <path d="M40 20h120a22 22 0 0 1 22 22v260a22 22 0 0 1-22 22H40a22 22 0 0 1-22-22V42A22 22 0 0 1 40 20Z" fill="url(#gWhite)" stroke="#CBD5E1"/>
    <rect x="28" y="48" width="144" height="220" rx="12" fill="#EFF6FF"/>
    <rect x="78" y="30" width="44" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="42" y="78" width="90" height="28" rx="10" fill="url(#gBlue)"/>
    <rect x="58" y="120" width="96" height="24" rx="10" fill="#DBEAFE"/>
    <rect x="42" y="158" width="76" height="22" rx="9" fill="#BFDBFE"/>
    <circle cx="100" cy="286" r="10" fill="#60A5FA"/>
  </g>

  <!-- right labels -->
  <g filter="url(#softShadow)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">
    <g transform="translate(700 100)">
      <rect width="92" height="30" rx="15" fill="url(#gBlue)"/>
      <text x="18" y="19" fill="#fff">实时推送</text>
    </g>
    <g transform="translate(690 250)">
      <rect width="92" height="30" rx="15" fill="url(#gBlue)"/>
      <text x="18" y="19" fill="#fff">消息展示</text>
    </g>
  </g>

  <!-- arrow queue to right phone -->
  <path d="M640 300 C700 280 740 260 780 230" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
  <path d="M772 236l12-6-4 14" fill="#3B82F6"/>
</svg>
